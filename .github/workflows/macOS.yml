name: Build Chromium 140 iOS
run-name: ${{ github.actor }} - Chromium 140.0.7339.208 🚀

on:
  workflow_dispatch: # 手动触发，避免产生不必要的账单

# 全局环境变量，解决 Node.js 20 警告并设置工具路径
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPOT_TOOLS_WIN_TOOLCHAIN: 0

jobs:
  build-chromium:
    runs-on: macos-14 # 必须使用 Apple Silicon (M1/M2) 节点
    timeout-minutes: 360 # 6小时上限
    
    steps:
      # 1. 环境初始化与版本检查
      - name: Environment Setup
        run: |
          echo "Xcode Version:"
          xcodebuild -version
          echo "Disk Space Before Cleanup:"
          df -h

      # 2. 深度清理磁盘（Chromium 编译成败的关键）
      - name: Maximize Disk Space
        run: |
          # 删除不需要的预装 SDK 和旧版 Xcode，腾出约 20GB 空间
          sudo rm -rf /Applications/Xcode_13* /Applications/Xcode_14*
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /Library/Frameworks/Mono.framework
          echo "Disk Space After Cleanup:"
          df -h

      # 3. 检出当前仓库（用于存储脚本，使用 v5 避免警告）
      - name: Checkout Repo
        uses: actions/checkout@v5

      # 4. 安装 depot_tools
      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      # 5. 拉取 Chromium 源码 (针对 140.0.7339.208)
      - name: Fetch Chromium Source
        run: |
          # 配置 gclient 仅针对 iOS
          cat <<EOF > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {"checkout_ios": True},
            },
          ]
          target_os = ["ios"]
          EOF

          # --no-history 极其重要，否则磁盘会瞬间爆满
          fetch --no-history --nohooks ios
          cd src
          # 精确切换到你的版本号
          git fetch origin tag 140.0.7339.208 --no-tags
          git checkout tags/140.0.7339.208
          
          # 执行依赖同步
          gclient sync -D --force --reset --nohooks

      # 6. 配置 GN 参数 (针对你的需求定制)
      - name: GN Generate
        run: |
          cd src
          gclient runhooks
          
          # 核心编译参数注入
          gn gen out/Release-iphoneos --args='
            target_os="ios"
            target_cpu="arm64"
            is_debug=false
            enable_remoting=false
            is_official_build=false
            is_component_build=false
            proprietary_codecs=true
            ffmpeg_branding="Chrome"
            symbol_level=0
            v8_symbol_level=0
            blink_symbol_level=0
            chrome_pgo_phase=0
            disable_fieldtrial_testing_config=true
            google_api_key="${{ secrets.G_API_KEY }}"
            google_default_client_id="${{ secrets.G_CLIENT_ID }}"
            google_default_client_secret="${{ secrets.G_CLIENT_SECRET }}"
            ios_enable_code_signing=false
          '

      # 7. 开始编译 (使用 autoninja 自动分配算力)
      - name: Compile
        run: |
          cd src
          autoninja -C out/Release-iphoneos chrome

      # 8. 上传产物 (使用 v5 避免警告)
      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Chromium-iOS-140-App
          path: |
            src/out/Release-iphoneos/*.app
            src/out/Release-iphoneos/*.ipa
          retention-days: 3
