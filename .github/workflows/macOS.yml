name: Build Chromium 140 iOS
on:
  workflow_dispatch: # 建议手动触发，因为编译一次非常昂贵

jobs:
  Chromium-Build:
    runs-on: macos-14
    timeout-minutes: 360 # 延长至 6 小时
    steps:
      - name: Maximize Disk Space
        run: |
          echo "Before cleaning:"
          df -h
          # 删除不需要的预装软件
          sudo rm -rf /Applications/Xcode_13* /Applications/Xcode_14*
          sudo rm -rf /opt/homebrew/Caskroom/google-cloud-sdk
          echo "After cleaning:"
          df -h
