<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Client Hints 指纹检测</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 15px; border-radius: 8px; shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .status { font-weight: bold; color: #d9534f; }
        pre { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .valid { color: #5cb85c; }
    </style>
</head>
<body>

    <h2>Client Hints (UAData) 探测</h2>

    <div class="card">
        <p>支持状态: <span id="support-status" class="status">检测中...</span></p>
        <p>基础平台 (Low Entropy): <span id="base-platform">-</span></p>
        <p>是否移动端: <span id="is-mobile">-</span></p>
    </div>

    <div class="card">
        <h3>高熵值详情 (High Entropy Values)</h3>
        <p><small>注：这些值通常需要异步请求，模拟 iOS 时应确保此处报错或返回空。</small></p>
        <pre id="high-entropy-log">等待异步获取...</pre>
    </div>

    <script>
        const supportEl = document.getElementById('support-status');
        const logEl = document.getElementById('high-entropy-log');

        if (navigator.userAgentData) {
            supportEl.innerText = "已启用 (Chromium 特征)";
            supportEl.className = "status valid";

            // 1. 获取低熵基础信息（直接读取）
            document.getElementById('base-platform').innerText = navigator.userAgentData.platform;
            document.getElementById('is-mobile').innerText = navigator.userAgentData.mobile;

            // 2. 获取高熵详细信息（异步请求）
            // 常见的 hints: 'architecture', 'model', 'platformVersion', 'fullVersionList'
            navigator.userAgentData.getHighEntropyValues([
                'architecture', 
                'model', 
                'platformVersion', 
                'uaFullVersion', 
                'fullVersionList',
                'bitness'
            ]).then(values => {
                logEl.innerText = JSON.stringify(values, null, 4);
            }).catch(err => {
                logEl.innerText = "获取失败: " + err.message;
            });

        } else {
            supportEl.innerText = "未定义 (符合 iOS/Safari 特征)";
            logEl.innerText = "navigator.userAgentData 为 undefined。";
        }
    </script>
</body>
</html>
