<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>内核指纹深度扫描</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; padding: 40px; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        h1 { color: #333; font-size: 24px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .metric { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #fafafa; }
        .label { font-weight: 600; color: #555; }
        .value { font-family: monospace; color: #007bff; }
        .status { font-weight: bold; }
        .fail { color: #d32f2f; }
        .pass { color: #388e3c; }
        .warning { color: #f57c00; }
        pre { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>

<div class="card">
    <h1>内核指纹一致性深度报告</h1>
    
    <div class="metric">
        <span class="label">声明身份 (UA):</span>
        <span id="ua-val" class="value"></span>
    </div>

    <h3>1. 基础存在性检测 (Basic Existence)</h3>
    <div id="basic-tests"></div>

    <h3>2. 原型链与描述符检测 (Prototype & Descriptor)</h3>
    <p><small>iOS 真实 Chrome 不应存在任何 Chrome 对象的描述符。</small></p>
    <div id="descriptor-tests"></div>

    <h3>3. 逻辑冲突扫描 (Cross-Check)</h3>
    <div id="logic-tests"></div>
</div>

<script>
    const $ = (id) => document.getElementById(id);
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad/.test(ua);
    $('ua-val').textContent = ua;

    function addResult(containerId, label, value, status, expected) {
        const div = document.createElement('div');
        div.className = 'metric';
        div.innerHTML = `
            <span class="label">${label}:</span>
            <span class="value">${value}</span>
            <span class="status ${status === expected ? 'pass' : 'fail'}">
                ${status === expected ? '✓ 一致' : '✗ 冲突'}
            </span>
        `;
        $(containerId).appendChild(div);
    }

    // --- 1. 基础检测 ---
    const typeofChrome = typeof window.chrome;
    addResult('basic-tests', 'typeof window.chrome', typeofChrome, typeofChrome, isIOS ? 'undefined' : 'object');

    const inWindow = "chrome" in window;
    addResult('basic-tests', '"chrome" in window', inWindow, inWindow, isIOS ? false : true);

    // --- 2. 深度描述符检测 ---
    // 即使你设置 window.chrome = undefined，属性可能依然存在于原型链上
    const desc = Object.getOwnPropertyDescriptor(window, 'chrome');
    const descStatus = desc === undefined ? 'Clean' : 'Dirty';
    addResult('descriptor-tests', 'Property Descriptor', descStatus, descStatus, 'Clean');

    if (desc) {
        console.log("检测到残留描述符:", desc);
    }

    // 检测是否为代理对象 (Proxy Detection)
    let isProxy = false;
    try {
        if (window.chrome) {
            window.chrome.toString();
        }
    } catch(e) {
        if (e.message.includes('Proxy')) isProxy = true;
    }
    addResult('descriptor-tests', 'Is Proxy Object', isProxy, isProxy, false);

    // --- 3. 逻辑冲突 (内核背叛) ---
    // 检测只有 Chromium 内核才有的特定 CSS 属性
    const hasChromiumCSS = CSS.supports('-webkit-app-region', 'drag');
    addResult('logic-tests', 'Chromium Exclusive CSS', hasChromiumCSS, hasChromiumCSS, isIOS ? false : true);

    // 检测权限 API 差异
    const hasQueryPermission = !!(navigator.permissions && navigator.permissions.query);
    addResult('logic-tests', 'Permissions API (Chromium feature)', hasQueryPermission, hasQueryPermission, isIOS ? false : true);

    // 检测
