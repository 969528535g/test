<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromium 内核指纹一致性诊断</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .row { display: flex; justify-content: space-between; padding: 12px 8px; border-bottom: 1px solid #334155; align-items: center; }
        .row:last-child { border-bottom: none; }
        .label { font-weight: 500; color: #94a3b8; flex: 2; }
        .value { font-family: "SFMono-Regular", Consolas, monospace; flex: 2; text-align: right; overflow-wrap: break-word; }
        .status { flex: 1; text-align: right; font-weight: bold; margin-left: 20px; }
        .pass { color: #10b981; } .fail { color: #ef4444; animation: blink 1.5s infinite; }
        .warning { color: #f59e0b; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        h2 { color: #38bdf8; font-size: 1.2rem; margin-top: 0; }
        .summary { font-size: 1.1rem; padding: 15px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>内核一致性详细报告</h1>
            <p id="ua-text" style="color: #64748b; font-size: 0.9rem;"></p>
        </div>

        <div id="final-status" class="summary card">正在分析内核指纹...</div>

        <div class="card">
            <h2>1. Chrome 对象深度扫描</h2>
            <div id="section-1"></div>
        </div>

        <div class="card">
            <h2>2. 属性描述符 (Descriptor) 验证</h2>
            <div id="section-2"></div>
        </div>

        <div class="card">
            <h2>3. 跨 API 逻辑校验 (内核身份)</h2>
            <div id="section-3"></div>
        </div>
    </div>

<script>
    const isIOSUA = /iPhone|iPad|iPod/.test(navigator.userAgent);
    document.getElementById('ua-text').innerText = navigator.userAgent;

    function report(section, label, actual, expected, detail = "") {
        const isPass = String(actual) === String(expected);
        const container = document.getElementById('section-' + section);
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
            <div class="label">${label}<br><small style="font-size:0.7rem; color:#475569">${detail}</small></div>
            <div class="value">${actual}</div>
            <div class="status ${isPass ? 'pass' : 'fail'}">${isPass ? 'PASS' : 'CONFLICT'}</div>
        `;
        container.appendChild(row);
        return isPass;
    }

    let results = [];

    // --- 断面 1: 存在性 ---
    results.push(report(1, "typeof window.chrome", typeof window.chrome, isIOSUA ? 'undefined' : 'object', "iOS 环境不应定义 chrome 对象"));
    results.push(report(1, "'chrome' in window", 'chrome' in window, isIOSUA ? false : true, "检查 Key 是否存在于全局变量列表"));

    // --- 断面 2: 描述符 (这是最容易露馅的地方) ---
    const desc = Object.getOwnPropertyDescriptor(window, 'chrome');
    results.push(report(2, "Descriptor Exists", !!desc, isIOSUA ? false : true, "iOS 绝不应有 chrome 的属性描述符"));
    
    if (desc) {
        results.push(report(2, "Descriptor Configurable", desc.configurable, false, "原生 Chrome 该属性不可配置，若为 true 则说明是 JS 注入"));
        results.push(report(2, "Descriptor Enumerable", desc.enumerable, true, "原生 Chrome 该属性是可枚举的"));
    } else {
        results.push(report(2, "Clean Context", "Clean", "Clean", "没有检测到残留描述符"));
    }

    // --- 断面 3: 逻辑冲突 (内核交叉验证) ---
    
    // A. 错误堆栈格式 (V8 vs JSC)
    let stackType = "Unknown";
    try { null.f(); } catch (e) {
        stackType = e.stack.includes('at ') ? "V8 (Chromium)" : "JSC (Safari)";
    }
    results.push(report(3, "JS Engine Stack Trace", stackType, isIOSUA ? "JSC (Safari)" : "V8 (Chromium)", "iOS 使用 @，Chromium 使用 at "));

    // B. 特有 API 注入
    const hasInternalApp = !!(window.chrome && window.chrome.app);
    results.push(report(3, "chrome.app API", hasInternalApp, isIOSUA ? false : true, "检查扩展引擎子 API 是否随之隐藏"));

    // C. CSS 渲染引擎特征
    const hasWebkitAppRegion = CSS.supports('-webkit-app-region', 'drag');
    results.push(report(3, "CSS: -webkit-app-region", hasWebkitAppRegion, isIOSUA ? false : true, "这是 Chromium 特有的 CSS 属性"));

    // 总结报告
    const finalDiv = document.getElementById('final-status');
    const allPass = results.every(r => r === true);
    if (allPass) {
        finalDiv.innerHTML = "✅ 指纹一致性完美：hasInconsistentChromeObject 将为 false";
        finalDiv.style.color = "#10b981";
    } else {
        finalDiv.innerHTML = "❌ 检测到逻辑冲突：已被标记为 hasInconsistentChromeObject: true";
        finalDiv.style.color = "#ef4444";
    }
</script>
</body>
</html>
