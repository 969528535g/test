<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>浏览器指纹一致性检测</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .result { padding: 15px; border-radius: 8px; margin-top: 10px; }
        .fail { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .pass { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        code { background: #eee; padding: 2px 4px; }
    </style>
</head>
<body>
    <h2>一致性检测: <code>hasInconsistentChromeObject</code></h2>
    <div id="ua-display"></div>
    <div id="test-result" class="result">正在检测...</div>

    <script>
        (function() {
            const ua = navigator.userAgent;
            const isIOS = /iPhone|iPad|iPod/.test(ua);
            const hasChromeObject = window.chrome !== undefined;
            
            const uaDisplay = document.getElementById('ua-display');
            const resultDiv = document.getElementById('test-result');

            uaDisplay.innerHTML = `<p>当前 User-Agent: <br><code>${ua}</code></p>`;

            // 检测逻辑：
            // 如果 UA 声明是 iOS 设备，但环境中却存在 window.chrome 对象
            // 这在逻辑上是矛盾的，判定为 hasInconsistentChromeObject: true
            if (isIOS && hasChromeObject) {
                resultDiv.className = 'result fail';
                resultDiv.innerHTML = `
                    <strong>检测结果：FAIL (已标记为 Bot)</strong><br>
                    原因：检测到 <code>hasInconsistentChromeObject: true</code>。<br>
                    逻辑矛盾：你声称自己是 iOS 设备，但你的全局变量中存在 Chromium 特有的 <code>window.chrome</code> 对象。
                `;
                console.error({
                    isBot: true,
                    details: { hasInconsistentChromeObject: true }
                });
            } else if (!isIOS && !hasChromeObject && /Chrome/.test(ua)) {
                // 另一种情况：UA 说是桌面 Chrome，但没有 chrome 对象（比如某些极端的 Headless 修改）
                resultDiv.className = 'result fail';
                resultDiv.innerHTML = `<strong>检测结果：FAIL</strong><br>UA 声明为 Chrome 但缺失 <code>window.chrome</code>。`;
            } else {
                resultDiv.className = 'result pass';
                resultDiv.innerHTML = `
                    <strong>检测结果：PASS</strong><br>
                    环境对象与 User-Agent 声明保持一致。
                `;
                console.log({
                    isBot: false,
                    details: { hasInconsistentChromeObject: false }
                });
            }
        })();
    </script>
</body>
</html>
