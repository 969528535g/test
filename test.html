<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>iOS 伪装一致性最终检查</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { border-bottom: 2px solid #007aff; padding-bottom: 10px; color: #1d1d1f; }
        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .label { font-weight: 600; color: #444; }
        .value { font-family: "SF Mono", "Menlo", monospace; font-size: 14px; }
        .status { margin-left: 10px; font-weight: bold; }
        .pass { color: #28a745; }
        .fail { color: #dc3545; }
        .warning { background: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 20px; font-size: 13px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h2>iOS 环境对齐检查</h2>
    
    <div id="results"></div>

    <div class="warning">
        <strong>💡 诊断指南：</strong><br>
        1. <b>vendor:</b> 如果不是 <u>Apple Computer, Inc.</u>，`isBot` 必红。<br>
        2. <b>appRegion:</b> 如果是 <u>true</u>，说明 Chromium 特有的拖拽功能泄露了。<br>
        3. <b>uaData:</b> 如果是 <u>true</u>，说明 Client Hints 没关掉，这是 Chromium 的铁证。
    </div>
</div>

<script>
    const target = {
        vendor: "Apple Computer, Inc.",
        platform: "iPhone", // 或者是 iPad
        appRegion: false,
        uaData: false
    };

    const current = {
        vendor: navigator.vendor,
        platform: navigator.platform,
        appRegion: CSS.supports('-webkit-app-region', 'drag'),
        uaData: !!navigator.userAgentData
    };

    const resultsDiv = document.getElementById('results');

    for (let key in current) {
        const val = current[key];
        const isPass = val === target[key];
        
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
            <span class="label">${key}:</span>
            <span class="value">
                ${val}
                <span class="status ${isPass ? 'pass' : 'fail'}">
                    ${isPass ? '● 一致' : '● 冲突'}
                </span>
            </span>
        `;
        resultsDiv.appendChild(row);
    }

    console.log("Full Report:", current);
</script>
</body>
</html>
